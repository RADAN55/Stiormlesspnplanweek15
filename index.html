table.glance{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:16px;background:#fff}

.card3d .fa{background:#fff;color:var(--navy)}

.timer{position:fixed;right:16px;bottom:70px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 16px;font-weight:800;font-size:1.6rem;display:none;align-items:center;gap:10px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4);border:2px solid var(--gold)}
.timer.show{display:flex}.timer.low{background:#c53030}
.timer button{font:inherit;font-size:.7rem;background:#fff;color:#111;border:0;border-radius:6px;padding:4px 8px;cursor:pointer}

const DAYS=[
{id:"mon",tab:"Mon 11/16",title:"How Soccer Got Its Rules",
 co:"I can identify the central idea of an informational text about soccer history.",
 lo:"I can write a 3-sentence summary using first, then, today.",

 donow:"What sports did you play as a child? Where?",fe:"I played ___ in ___.",fp:"When I was a child, I played ___ because ___.",
 words:[["rule","regla"],["club","club"],["association","asociación"],["global","mundial"]],
 text:["People have kicked balls for thousands of years. In ancient China, players kicked a leather ball through a net in a game called cuju. But for a long time, every town had different {rules}. Some players could carry the ball. Others could only kick it.",
 "In 1863, a group of {clubs} met in London, England. They formed the Football {Association} and wrote one set of rules. The biggest rule was simple: no carrying the ball with your hands. Only the goalkeeper could use hands. Clubs that wanted to carry the ball went a different way and played rugby.",
 "The name \"soccer\" comes from the word association. Most countries still call the sport football, but the United States uses soccer.",
 "In 1904, FIFA was formed to organize soccer around the world. In 1930, Uruguay hosted the first World Cup and won it. Shared rules turned a local game into a {global} sport."],
 steps:[
 ["0–5","Do Now","other",5,"Turn and talk about the board question.","Use the frame on the yellow card.","Use the frame on the yellow card."],
 ["5–30","Reading","reading",25,"Learn 4 words. Listen to Text 1. Reread with a partner. Find the central idea: What is the whole text mostly about?","Highlight 3 dates. Match each date to a picture. Choose the central idea from 3 options.","Box the dates. Underline the sentence with the central idea. Stretch: Why did rugby split from soccer?"],
 ["30–60","Writing","writing",30,"Write a 3-sentence summary with First / Then / Today.","First, people ___. Then, in 1863, ___. Today, ___.","Write your own summary with transitions. Partner check: Is the central idea there?"],
 ["60–85","ELPA21 Prep: Listening","elpa",25,"Listen to the Tryout Announcement two times. Answer 4 questions.","Picture choices. You may hear it a third time.","Answer all 4 + Why should students bring water?"],
 ["85–90","Exit Ticket","other",5,"Sticky note.","Draw and label one rule of soccer.","Write the central idea of Text 1 in one sentence."]],
 extra:{3:"Teacher script — Tryout Announcement:\n\"Good morning, Laurel High! Soccer tryouts start on Tuesday, December 1st, after school at 3:30 on the back field. Bring cleats, shin guards, and a water bottle. You must have a signed sports form from the front office. If it rains, tryouts move to the gym. See Coach Rivera with questions.\"\n\n1. What day do tryouts start?\n2. What time?\n3. Name two things to bring.\n4. Where do tryouts go if it rains?"}},
{id:"tue",tab:"Tue 11/17",title:"One Tournament, Three Countries",
 co:"I can use numbers and text features as evidence about the 2026 World Cup.",
 lo:"I can compare two things using both, but, more than, while.",
 cando:"I can compare two things and give facts from a text.",
 es:"Puedo comparar dos cosas y dar datos del texto.",

 donow:"Did you watch any 2026 World Cup games? Which team do you support?",fe:"I support ___.",fp:"I support ___ because ___.",
 words:[["host","anfitrión"],["compete","competir"],["match","partido"],["history","historia"]],
 text:["The 2026 FIFA World Cup made {history}. For the first time, three countries hosted it together: the United States, Mexico, and Canada.",
 "It was also the biggest World Cup ever. Past tournaments had 32 teams. In 2026, 48 teams {competed}, and they played 104 {matches}. Games took place in 16 cities: 11 in the United States, 3 in Mexico, and 2 in Canada.",
 "The tournament opened on June 11, 2026, at Estadio Azteca in Mexico City. Mexico also {hosted} the World Cup in 1970 and 1986, so it became the first country to host the men's tournament three times. The final was played on July 19 at MetLife Stadium in New Jersey.",
 "More teams meant more countries had a chance to play on the world stage. For many fans in Mississippi, a World Cup game was only a road trip away."],
 steps:[
 ["0–5","Do Now","other",5,"Answer the board question with a partner.","Use the frame.","Use the frame."],

 ["85–90","Exit Ticket","other",5,"Mini whiteboards.","Show how many host countries. Say one.","Write one sentence comparing 2022 and 2026."]],

{id:"wed",tab:"Wed 11/18",title:"The Science of a Curving Kick",
 co:"I can explain the cause-and-effect steps that make a soccer ball curve.",
 lo:"I can explain a process using sequence words and because / so.",
 cando:"I can explain how something happens, step by step.",
 es:"Puedo explicar cómo pasa algo, paso a paso.",
 std:"MS CCR ELA: RI.9-10.3, RI.9-10.4, W.9-10.2 · MS ELP: ELP 1, ELP 3, ELP 8 · ELPA21 domain: Reading",
 donow:"Watch the paper ball spin. What did it do? Why?",fe:"It ___ because ___.",fp:"I think the ball curves because ___.",
 words:[["spin","girar"],["force","fuerza"],["pressure","presión"],["curve","curva"]],
 text:["Have you ever seen a soccer ball bend around a wall of players and into the goal? It looks like magic, but it is science.",
 "First, the player kicks the ball off-center, on one side instead of the middle. This makes the ball {spin}. As the ball spins, it drags the air around it. On one side, the air moves faster. On the other side, it moves slower. Faster air creates lower {pressure}. Because the pressure is lower on one side, the ball is pushed toward that side, so its path {curves}.",
 "Scientists call this the Magnus effect. The same {force} helps a baseball curve and a tennis ball dip.",
 "Players practice for years to control spin. A little spin makes a small curve. A lot of spin makes a big curve. In 1997, Brazilian player Roberto Carlos curved a free kick so far that fans still talk about it today."],
 steps:[

 ["30–60","Writing","writing",30,"Write a \"How It Works\" paragraph: topic sentence + 4 steps with first, next, then, finally.","Use the paragraph frame and word bank.","Write it on your own. Use one because and one so. Partner reads it aloud to check the order."],

 ["85–90","Exit Ticket","other",5,"Collect.","Draw an arrow for the curve. Label spin.","The ball curves because ___, so ___."]],
 extra:{3:"Why Soccer Balls Have Panels\nA soccer ball is not one smooth piece. It is made of panels that are joined together. For many years, most balls had 32 panels shaped like hexagons and pentagons. Today, many balls have fewer panels with special shapes. The seams between panels change how air moves around the ball. If a ball is too smooth, it can move in strange ways in the air. Designers test new balls in wind tunnels and with kicking machines before a big tournament.\n\n1. What is the main idea?\n2. What does seams mean?\n3. Select the sentence that tells how designers test balls.\n4. Which came first: 32-panel balls or new-shape balls?\n5. True or False: A smoother ball always flies straighter."}},

const stage=document.getElementById("stage"),foot=document.getElementById("foot");
stage.innerHTML=PAGES.map((p,i)=>`<section class="page hidden-next" data-i="${i}">${p.html}</section>`).join("");
const els=[...stage.querySelectorAll(".page")];
foot.innerHTML=`<button class="arrow" type="button" id="prev">◀</button>`+PAGES.map((p,i)=>`<button type="button" data-go="${i}">${p.name}</button>`).join("")+`<button class="arrow" type="button" id="next">▶</button>`;
let cur=0;
function go(n){n=Math.max(0,Math.min(PAGES.length-1,n));els.forEach((e,i)=>{e.className="page "+(i===n?"cur":i<n?"hidden-prev":"hidden-next")});cur=n;
 foot.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("on",+b.dataset.go===n));document.getElementById("pgNo").textContent=`Page ${n+1} / ${PAGES.length}`;els[n].scrollTop=0;
 try{history.replaceState(null,"","#p"+(n+1))}catch(e){}}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g){go(+g.dataset.go);return}
 if(e.target.id==="prev")go(cur-1);if(e.target.id==="next")go(cur+1);
 const w=e.target.closest(".w");if(w){w.classList.toggle("flip");return}
 const c=e.target.closest(".chip");if(c){c.classList.toggle("show");return}
 const f=e.target.closest(".card3d");if(f){f.classList.toggle("f");return}
 const t=e.target.closest("[data-t]");if(t){startTimer(+t.dataset.t);return}
 const d=e.target.closest(".done-btn");if(d){d.closest(".st").classList.toggle("done");return}
 if(e.target.id==="check")checkQuiz();if(e.target.id==="reset")resetQuiz();
});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
let sx=null;stage.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1));sx=null});
function checkQuiz(){let n=0;QUIZ.forEach((q,i)=>{const box=document.querySelector(`[data-q="${i}"]`);const labs=box.querySelectorAll("label");labs.forEach(l=>l.classList.remove("ok","no"));labs[q[2]].classList.add("ok");const s=box.querySelector("input:checked");if(s&&+s.value===q[2])n++;else if(s)s.parentElement.classList.add("no")});
 document.getElementById("score").textContent=`${n}/10 ${n>=8?"¡Golazo!":n>=6?"Good work!":"Reread and try again"}`}
function resetQuiz(){document.querySelectorAll(".q input").forEach(i=>i.checked=false);document.querySelectorAll(".q label").forEach(l=>l.classList.remove("ok","no"));document.getElementById("score").textContent=""}
document.getElementById("laneSel").onchange=e=>{document.body.classList.remove("lane-e","lane-p");if(e.target.value!=="both")document.body.classList.add("lane-"+e.target.value)};
document.getElementById("bigBtn").onclick=()=>document.body.classList.toggle("big");
let tInt=null,tLeft=0,paused=false;const tEl=document.getElementById("timer"),tTxt=document.getElementById("tLeft");
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function startTimer(m){clearInterval(tInt);tLeft=m*60;paused=false;document.getElementById("tPause").textContent="Pause";tEl.classList.add("show");tEl.classList.remove("low");tTxt.textContent=fmt(tLeft);
 tInt=setInterval(()=>{if(paused)return;tLeft--;tTxt.textContent=fmt(Math.max(tLeft,0));if(tLeft<=60)tEl.classList.add("low");if(tLeft<=0){clearInterval(tInt);tTxt.textContent="Time!"}},1000)}
document.getElementById("tPause").onclick=()=>{paused=!paused;document.getElementById("tPause").textContent=paused?"Resume":"Pause"};
document.getElementById("tStop").onclick=()=>{clearInterval(tInt);tEl.classList.remove("show")};
const m=(location.hash||"").match(/^#p(\d+)$/);go(m?+m[1]-1:0);
</script>
