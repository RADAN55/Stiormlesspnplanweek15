function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

 <div class="stepbtns"><button class="btn" type="button" data-t="${s[3]}">▶ ${s[3]}-min timer</button><button class="btn alt" type="button" data-done>✓ Done</button></div></div></div>`});
 h+=`</div><div class="grid" style="margin-top:16px"><div class="card text"><h3>Text ${DAYS.indexOf(d)+1}: ${d.title}</h3>${d.text.map(p=>`<p>${markText(p,d.words)}</p>`).join("")}<p class="es" style="font-size:.8em">Pasa el cursor o toca las palabras amarillas para ver el español.</p></div>
 <div class="card"><h3>Key Words</h3><div class="vocab">${d.words.map(w=>`<span class="chip">${w[0]}<i>/ ${w[1]}</i></span>`).join("")}</div>
 <h3 style="margin-top:14px">Week 15 Word Wall</h3><div class="vocab">${[["rule","regla"],["tournament","torneo"],["host","anfitrión"],["compete","competir"],["spin","girar"],["force","fuerza"],["champion","campeón"],["equal","igual"],["community","comunidad"],["teamwork","trabajo en equipo"]].map(w=>`<span class="chip">${w[0]} <i>/ ${w[1]}</i></span>`).join("")}</div></div></div>`;
 if(cur==="fri"){h+=c2Panel()+quizPanel()}
 app.innerHTML=h;
 app.querySelectorAll(".step .head").forEach(el=>el.onclick=()=>el.parentElement.classList.toggle("open"));
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=e=>{e.stopPropagation();startTimer(+b.dataset.t)});
 app.querySelectorAll("[data-done]").forEach(b=>b.onclick=e=>{e.stopPropagation();const st=b.closest(".step");st.classList.toggle("done");st.classList.remove("open")});
 if(cur==="fri")wireQuiz();
}
function c2Panel(){return `<div class="card" style="margin-top:16px;border:2px solid #b7791f"><h3>Teacher Panel · NBCT ENL Component 2 · Sample 2</h3>
<p>Second writing sample for each featured student (Sample 1 was the Nov 10 cold write). Keep the time, seating, and supports the same as Sample 1 so the growth is real. Use letters only: Student A, Student B, Student C.</p>
<table class="c2"><tr><th>Step</th><th>Time</th><th>What to do</th></tr>
<tr><td>1. Set up</td><td>3 min</td><td>Read the prompt in English, then in Spanish. Show the dialogue checklist. Do not reteach.</td></tr>
<tr><td>2. Plan</td><td>7 min</td><td>3-box plan: Beginning (who, where) → Middle (what happened + dialogue) → End (feeling / lesson).</td></tr>
<tr><td>3. Write</td><td>20 min</td><td>Independent writing. Same conditions as Sample 1.</td></tr>
<tr><td>4. Self-check</td><td>5 min</td><td>Tick the checklist. Underline the dialogue.</td></tr></table>
<div class="check" style="margin-top:10px"><b>After class</b>
<label><input type="checkbox"> Collect Sample 2 for Students A, B, C (+ spare). Remove names.</label>
<label><input type="checkbox"> Scan the planner and draft. File them next to Sample 1.</label>
<label><input type="checkbox"> Count the Sample 1 features again: sentences, dialogue lines, correct punctuation, speaker tags, transitions.</label>
<label><input type="checkbox"> Commentary notes: the growth with evidence · which support caused it · the next step.</label>
<label><input type="checkbox"> Note any change in conditions from Sample 1.</label></div></div>`}
function quizPanel(){return `<div class="card quiz" style="margin-top:16px"><h3>10-Question Quiz · Texts 1–5</h3>${QUIZ.map((q,i)=>`<div class="q" data-q="${i}"><b>${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join("")}</div>`).join("")}
<div class="stepbtns"><button class="btn" type="button" id="check">Check my answers</button><button class="btn alt" type="button" id="reset">Try again</button></div><div class="score" id="score"></div></div>`}
function wireQuiz(){
 document.getElementById("check").onclick=()=>{let n=0;QUIZ.forEach((q,i)=>{const box=app.querySelector(`[data-q="${i}"]`);box.querySelectorAll("label").forEach(l=>l.classList.remove("ok","no"));const sel=box.querySelector("input:checked");const right=box.querySelectorAll("label")[q[2]];right.classList.add("ok");if(sel&&+sel.value===q[2])n++;else if(sel)sel.parentElement.classList.add("no")});
  document.getElementById("score").textContent=`Score: ${n} / 10 ${n>=8?"— ¡Golazo!":n>=6?"— Good work!":"— Review the texts and try again."}`};
 document.getElementById("reset").onclick=()=>render();
}
let tInt=null,tLeft=0,paused=false;const tEl=document.getElementById("timer"),tTxt=document.getElementById("tLeft");
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function startTimer(m){clearInterval(tInt);tLeft=m*60;paused=false;document.getElementById("tPause").textContent="Pause";tEl.classList.add("show");tEl.classList.remove("low");tTxt.textContent=fmt(tLeft);
 tInt=setInterval(()=>{if(paused)return;tLeft--;tTxt.textContent=fmt(Math.max(tLeft,0));if(tLeft<=60)tEl.classList.add("low");if(tLeft<=0){clearInterval(tInt);tTxt.textContent="Time!"}},1000)}
document.getElementById("tPause").onclick=()=>{paused=!paused;document.getElementById("tPause").textContent=paused?"Resume":"Pause"};
document.getElementById("tStop").onclick=()=>{clearInterval(tInt);tEl.classList.remove("show")};
document.getElementById("bigBtn").onclick=()=>document.body.classList.toggle("big");
document.getElementById("esBtn").onclick=()=>document.body.classList.toggle("showes");
function fromHash(){const h=(location.hash||"").slice(1);if(DAYS.some(d=>d.id===h))cur=h;else{const wd=new Date().getDay();cur=["mon","mon","tue","wed","thu","fri","mon"][wd]}}
fromHash();window.addEventListener("hashchange",()=>{fromHash();render()});render();
</script>
</body>
